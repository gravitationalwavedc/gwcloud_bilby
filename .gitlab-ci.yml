default:
  image:
    name: ubuntu:24.04
    entrypoint: ["/usr/bin/env"]

stages:
  - CI

# -----------------------------------------------------------------------------
# Reusable script fragments (use with !reference [.job_name, script])
# -----------------------------------------------------------------------------

.apt_base:
  script:
    - apt -y update
    - apt -y install apt-utils net-tools python3.12 python3-venv git curl wget
    - apt -y upgrade

# Use for any job that runs poetry install (build-essential needed for compiling wheels).
# default-libmysqlclient-dev + pkg-config required for building mysqlclient from source.
.apt_build:
  script:
    - apt -y update
    - apt -y install apt-utils net-tools python3.12 python3-venv git curl wget python3-dev build-essential python3-setuptools pkg-config default-libmysqlclient-dev
    - apt -y upgrade

.install_poetry:
  script:
    - curl -sSL https://install.python-poetry.org | python3 -
    - export PATH="$HOME/.local/bin:$PATH"

# Each fragment ends at repo root so job scripts can use paths from project root.
.poetry_install_src:
  script:
    - cd src/
    - poetry install
    - cd ..

.poetry_install_cron:
  script:
    - cd gwosc_cron/
    - poetry install
    - cd ..

.poetry_install_gwflow_cron:
  script:
    - cd gwflow_cron/
    - poetry install
    - cd ..

# -----------------------------------------------------------------------------
# Base templates for Poetry jobs
# -----------------------------------------------------------------------------

.poetry_job_base:
  stage: CI
  variables:
    POETRY_VIRTUALENVS_IN_PROJECT: "true"

.src_poetry_base:
  extends: .poetry_job_base
  cache:
    key:
      files:
        - src/poetry.lock
    paths:
      - ~/.cache/pypoetry
      - ~/.cache/ms-playwright
      - src/.venv
  before_script:
    - !reference [.apt_build, script]
    - !reference [.install_poetry, script]
    - !reference [.poetry_install_src, script]

.gwosc_cron_base:
  extends: .poetry_job_base
  cache:
    key:
      files:
        - gwosc_cron/poetry.lock
    paths:
      - ~/.cache/pypoetry
      - gwosc_cron/.venv
  before_script:
    - !reference [.apt_build, script]
    - !reference [.install_poetry, script]
    - !reference [.poetry_install_cron, script]

.gwflow_cron_base:
  extends: .poetry_job_base
  cache:
    key:
      files:
        - gwflow_cron/poetry.lock
    paths:
      - ~/.cache/pypoetry
      - gwflow_cron/.venv
  before_script:
    - !reference [.apt_build, script]
    - !reference [.install_poetry, script]
    - !reference [.poetry_install_gwflow_cron, script]

# -----------------------------------------------------------------------------
# Django / src (Poetry)
# -----------------------------------------------------------------------------

django-tests:
  extends: .src_poetry_base
  script:
    # e2e suite needs Node.js/npm (shared Chromium server) and headless Chromium;
    # --with-deps apt-installs browser system libs (job runs as root). Node is
    # installed HERE, not in .apt_build, so cron base templates stay Node-free.
    # Node 20+ is pinned via NodeSource because Playwright requires >= 20 (the
    # Ubuntu 24.04 apt default is Node 18, which Playwright rejects).
    - apt -y install ca-certificates curl gnupg
    - mkdir -p /etc/apt/keyrings
    - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
    - echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_20.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
    - apt -y update
    - apt -y install nodejs
    - src/.venv/bin/playwright install --with-deps chromium
    - mkdir -p src/job_uploads/upload src/reports
    # Install the Node-side e2e deps ONCE, serially, before parallel workers
    # spawn. Each worker reaching an e2e test would otherwise race to mutate
    # .playwright/ (package.json, package-lock.json, node_modules) via its own
    # npm process. Flags mirror pw_server.py: exact pins, no lifecycle scripts,
    # no audit/fund chatter.
    - mkdir -p .playwright
    - test -f .playwright/package.json || printf '%s\n' '{"name":"e2e-test-deps","private":true}' > .playwright/package.json
    - npm install --prefix .playwright --ignore-scripts --no-audit --no-fund --save-exact "playwright@$(src/.venv/bin/python -c 'from importlib.metadata import version; print(version("playwright"))')" "axe-core@4.10.3"
    - cd src/ && PATH=".venv/bin:$PATH" bash run_coverage.sh --parallel
    - .venv/bin/python -m coverage xml -o reports/coverage.xml
  # Match coverage.py "TOTAL ... 95%" line; capture group is the percentage (GitLab displays in MR/pipeline)
  coverage: '/TOTAL.+ (\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: src/reports/coverage.xml
      junit: src/reports/junit.xml

ruff-lint:
  extends: .src_poetry_base
  script:
    - src/.venv/bin/ruff check --output-format gitlab --output-file gl-code-quality-report.json src/
  artifacts:
    reports:
      codequality: gl-code-quality-report.json

ruff-format:
  extends: .src_poetry_base
  script:
    - src/.venv/bin/ruff format --check src/

# -----------------------------------------------------------------------------
# Bundle (Conda)
# -----------------------------------------------------------------------------

bundle-tests:
  stage: CI
  cache:
    key:
      files:
        - bundle/conda-environment.yml
    paths:
      - bundle/venv
      - ~/.miniconda
  script:
    - !reference [.apt_base, script]
    - |
      if [ ! -d "$HOME/.miniconda" ]; then
        wget https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -O "$HOME/miniconda.sh"
        bash "$HOME/miniconda.sh" -b -p "$HOME/.miniconda"
      fi
    - cd bundle/
    - |
      if [ ! -d "venv" ]; then
        $HOME/.miniconda/bin/conda env create -f conda-environment.yml -p venv
      else
        $HOME/.miniconda/bin/conda env update --file conda-environment.yml --prune -p venv
      fi
    - $HOME/.miniconda/bin/conda run -p venv coverage run -m xmlrunner discover --output-file ./junit.xml
    - $HOME/.miniconda/bin/conda run -p venv coverage xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: bundle/coverage.xml
      junit: bundle/junit.xml

# -----------------------------------------------------------------------------
# Code quality (Docker)
# -----------------------------------------------------------------------------

code-quality:
  stage: CI
  image: docker:25
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    SP_VERSION: 0.85.26
  allow_failure: true
  services:
    - name: docker:25-dind
      alias: docker
  before_script:
    - until docker info 2>/dev/null; do echo "Waiting for Docker..."; sleep 1; done

  script:
    - docker run
      --env SOURCE_CODE="$PWD"
      --volume "$PWD":/code
      --volume /var/run/docker.sock:/var/run/docker.sock
      "registry.gitlab.com/gitlab-org/ci-cd/codequality:$SP_VERSION" /code
  artifacts:
    reports:
      codequality: gl-code-quality-report.json

# -----------------------------------------------------------------------------
# gwosc_cron (Poetry)
# -----------------------------------------------------------------------------

cronjob-tests:
  extends: .gwosc_cron_base
  script:
    - cd gwosc_cron/ && .venv/bin/python -m coverage run -m xmlrunner discover -s tests -t . --output-file ./junit.xml && .venv/bin/python -m coverage xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: gwosc_cron/coverage.xml
      junit: gwosc_cron/junit.xml

cronjob-ruff-format:
  extends: .gwosc_cron_base
  script:
    - gwosc_cron/.venv/bin/ruff format --check gwosc_cron/

cronjob-ruff-lint:
  extends: .gwosc_cron_base
  script:
    - gwosc_cron/.venv/bin/ruff check --output-format gitlab --output-file gl-code-quality-report.json gwosc_cron/
  artifacts:
    reports:
      codequality: gl-code-quality-report.json

# -----------------------------------------------------------------------------
# gwflow_cron (Poetry)
# -----------------------------------------------------------------------------

gwflow-cronjob-tests:
  extends: .gwflow_cron_base
  script:
    - cd gwflow_cron/ && .venv/bin/python -m coverage run -m xmlrunner discover -s tests -t . --output-file ./junit.xml && .venv/bin/python -m coverage xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: gwflow_cron/coverage.xml
      junit: gwflow_cron/junit.xml

gwflow-cronjob-ruff-format:
  extends: .gwflow_cron_base
  script:
    - gwflow_cron/.venv/bin/ruff format --check gwflow_cron/

gwflow-cronjob-ruff-lint:
  extends: .gwflow_cron_base
  script:
    - gwflow_cron/.venv/bin/ruff check --output-format gitlab --output-file gl-code-quality-report.json gwflow_cron/
  artifacts:
    reports:
      codequality: gl-code-quality-report.json
