{% load frontend_tags %}
{% with fid=f.id|stringformat:"d" %}
<div class="gw-file-actions">
  {% if f.uploaded %}
    <a class="btn btn-sm btn-outline-primary gw-file-download"
       href="{% url 'bilbyui:gwflow_file_download' token=f.download_token %}"
       target="_blank" rel="noopener noreferrer">
      <i class="bi-download" aria-hidden="true"></i>
      <span>Download</span>
    </a>
  {% else %}
    <span class="gw-file-download gw-file-download--disabled" aria-disabled="true">
      <i class="bi-download" aria-hidden="true"></i>
      <span>Download</span>
    </span>
    <button type="button" class="gw-file-why"
            aria-expanded="false"
            aria-controls="gw-file-why-{{ fid }}"
            onclick="var el = document.getElementById('gw-file-why-{{ fid }}'); el.hidden = !el.hidden; this.setAttribute('aria-expanded', el.hidden ? 'false' : 'true');">
      Why can't I download? <span aria-hidden="true">ⓘ</span>
    </button>
    <div id="gw-file-why-{{ fid }}" class="gw-file-why-body" hidden>
      This file is still being mirrored from the portal. Once mirroring finishes, the download will be available here.
    </div>
  {% endif %}
</div>
{% endwith %}
