{% extends "bilbyui/base.html" %}

{% block title %}{{ job.sname }} — GWCloud{% endblock %}

{% block content %}
<div class="container-fluid">
  <div class="col-md-10 offset-md-1 mb-5 pt-5">
    {% include "bilbyui/_gwflow_detail_header.html" %}

    <div x-data="{ tab: 'metadata' }" class="row">
      <div class="col-md-2">
        <ul class="nav nav-pills flex-column" role="tablist">
          <li class="nav-item">
            <a
              class="nav-link"
              id="metadata-tab"
              :class="{ active: tab === 'metadata' }"
              href="#"
              role="tab"
              @click.prevent="tab = 'metadata'"
            >
              Metadata
            </a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              id="files-tab"
              :class="{ active: tab === 'files' }"
              href="#"
              role="tab"
              @click.prevent="tab = 'files'"
            >
              Analyses &amp; Files
            </a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              id="history-tab"
              :class="{ active: tab === 'history' }"
              href="#"
              role="tab"
              @click.prevent="tab = 'history'"
            >
              History
            </a>
          </li>
        </ul>
      </div>

      <div class="col-md-8">
        <div
          x-show="tab === 'metadata'"
          id="metadata-pane"
          hx-get="{% url 'bilbyui:gwflow_job_metadata' sname=job.sname %}"
          hx-trigger="load once"
          hx-swap="innerHTML"
        >
          Loading…
        </div>
        <div
          x-show="tab === 'files'"
          id="files-pane"
          hx-get="{% url 'bilbyui:gwflow_job_files' sname=job.sname %}"
          hx-trigger="click once from:#files-tab"
          hx-swap="innerHTML"
        ></div>
        <div
          x-show="tab === 'history'"
          id="history-pane"
          hx-get="{% url 'bilbyui:gwflow_job_history' sname=job.sname %}"
          hx-trigger="click once from:#history-tab"
          hx-swap="innerHTML"
        ></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
