<div id="token-actions" class="mt-4">
  <div x-data="{ open: false }">
    <div x-show="!open" class="clearfix mb-3">
      <button type="button" class="btn btn-primary float-right" @click="open = true">Create Token</button>
    </div>

    <div x-show="open" x-cloak>
      <form id="token-create-form"
            method="post"
            action="{% url 'bilbyui:api_token_create' %}"
            hx-post="{% url 'bilbyui:api_token_create' %}"
            hx-target="#token-actions"
            hx-swap="innerHTML"
            class="mt-3">
        {% csrf_token %}
        <div class="form-group">
          <label for="token-name">Token Name</label>
          <input type="text"
                 id="token-name"
                 name="name"
                 class="form-control"
                 maxlength="64"
                 placeholder="Enter a name for your token"
                 required
                 autofocus>
        </div>
        <div class="d-flex">
          <button type="button" class="btn btn-secondary mr-2" @click="open = false">Cancel</button>
          <button type="submit" class="btn btn-primary">Create</button>
        </div>
      </form>
    </div>
  </div>
</div>
