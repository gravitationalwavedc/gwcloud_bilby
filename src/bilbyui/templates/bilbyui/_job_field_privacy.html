<div data-field="privacy">
  {% if modifiable %}
    <form id="privacy-form-{{ job.id }}"
          hx-post="{% url 'bilbyui:edit_job_privacy' job_id=job.id %}"
          hx-target="closest [data-field='privacy']"
          hx-swap="outerHTML"
          hx-trigger="change"
          hx-indicator="#privacy-indicator-{{ job.id }}">
      {% csrf_token %}
      <div class="form-check">
        <input type="checkbox"
               class="form-check-input"
               name="private"
               id="privacy-{{ job.id }}"
               {% if not job.private %}checked{% endif %} />
        <label class="form-check-label" for="privacy-{{ job.id }}">
          {% if job.is_ligo_job %}Share with LVK collaborators{% else %}Share publicly{% endif %}
        </label>
      </div>
      <div id="privacy-indicator-{{ job.id }}" class="htmx-indicator" aria-hidden="true">
        {% include "bilbyui/_async_state.html" with state="loading" thing="privacy" region_label="Job privacy" %}
      </div>
    </form>
  {% else %}
    <span class="text-muted">{% if job.private %}Private Job{% else %}Public Job{% endif %}</span>
  {% endif %}
</div>
