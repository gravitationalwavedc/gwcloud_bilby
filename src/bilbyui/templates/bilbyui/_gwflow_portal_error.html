<div class="card gw-form-card">
  <div class="card-body">
    <p class="mb-3">{{ error_message|default:"The metadata service is currently unavailable." }}</p>
    <button
      type="button"
      class="btn btn-primary"
      hx-get="{% if retry_url %}{{ retry_url }}{% else %}{% url 'bilbyui:gwflow_job_metadata' sname=sname %}{% endif %}"
      hx-target="{{ retry_target|default:'#metadata-pane' }}"
      hx-swap="innerHTML"
    >
      Retry
    </button>
  </div>
</div>
