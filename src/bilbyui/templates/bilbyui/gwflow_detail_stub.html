{% extends "bilbyui/base.html" %}

{% block title %}GWFlow — GWCloud{% endblock %}

{% block content %}
<div class="container-fluid">
  <div class="col-md-8 offset-md-2 col-lg-6 offset-lg-3 mb-5">
    <div class="card gw-form-card text-center">
      <div class="card-body py-5">
        <h2 class="h4 mb-3">GWFlow Job: {{ sname }}</h2>
        <p class="text-muted mb-4">
          The GWFlow job detail page is coming soon.
        </p>
        <div class="text-center">
          <a class="btn btn-primary m-2" href="{% url 'bilbyui:gwflow_jobs' %}">Back to GWFlow Jobs</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
