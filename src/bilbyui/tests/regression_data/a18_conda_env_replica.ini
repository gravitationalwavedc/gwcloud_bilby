# Replica of the sanitized fixture from GitLab issue #64. Difference vs the issue text: the
# spline-calibration-envelope-dict, psd-dict, and distance-marginalization-lookup-table entries are
# omitted because they point at cluster files that never exist in the container (tracked separately
# as A19); every other line is byte-identical to the issue.

################################################################################
## Calibration arguments
################################################################################
calibration-model=CubicSpline
spline-calibration-nodes=10
spline-calibration-amplitude-uncertainty-dict=None
spline-calibration-phase-uncertainty-dict=None

################################################################################
## Data generation arguments
################################################################################

ignore-gwpy-data-quality-check=True
gps-tuple=None
gps-file=None
timeslide-file=None
timeslide-dict=None
trigger-time=1372203988.204713
gaussian-noise=False
n-simulation=0
data-dict=None
data-format=gwf
channel-dict={ H1:GDS-CALIB_STRAIN_CLEAN_AR,L1:GDS-CALIB_STRAIN_CLEAN_AR, }
frame-type-dict={ H1:H1_HOFT_C00_AR,L1:L1_HOFT_C00_AR, }

################################################################################
## Detector arguments
################################################################################

coherence-test=False
detectors=['H1', 'L1']
duration=16
generation-seed=42
psd-fractional-overlap=0.5
post-trigger-duration=2.0
sampling-frequency=4096
psd-length=16
psd-maximum-duration=1024
psd-method=median
psd-start-time=None
minimum-frequency={ H1:20,L1:20, waveform: 15.98  }
maximum-frequency={ H1:1792,L1:1792, }
zero-noise=False
tukey-roll-off=1.0
resampling-method=lal

################################################################################
## Injection arguments
################################################################################

injection=False
injection-dict=None
injection-file=None
injection-numbers=None
injection-waveform-approximant=None

################################################################################
## Job submission arguments
################################################################################
accounting=ligo.prod.o5.cbc.pe.example
accounting_user = user
label = E2309xyz--bilby-IMRPhenomXPHM-SpinTaylor-7
local=False
local-generation=False
local-plot=False
outdir=/home/user/gwflow/working/E2309xyz/bilby-IMRPhenomXPHM-SpinTaylor-7
periodic-restart-time=10000
request-memory=4.0
request-memory-generation=None
request-cpus=16
request-disk=8
scheduler=condor
scheduler-args=None
scheduler-module=None
scheduler-env=None
transfer-files=True
log-directory=None
online-pe=False
osg=True
desired-sites=None

################################################################################
## Likelihood arguments
################################################################################

distance-marginalization=True
phase-marginalization=False
time-marginalization=False
calibration-marginalization=False
jitter-time=True
time-reference=H1
reference-frame=H1L1

likelihood-type=GravitationalWaveTransient

extra-likelihood-kwargs=None

################################################################################
## Output arguments
################################################################################

plot-calibration=False
plot-corner=False
plot-marginal=False
plot-skymap=False
plot-waveform=False
plot-format=png
create-summary=False
email=None
existing-dir=None
webdir=/home/user/public_html/gwflow/E2309xyz/bilby-IMRPhenomXPHM-SpinTaylor-7
summarypages-arguments=None
result-format=hdf5
final-result=True
final-result-nsamples=20000

################################################################################
## Executables
################################################################################
analysis-executable=/cvmfs/software.igwn.org/conda/envs/igwn-py311-20260701/bin/bilby_pipe_analysis
conda-env=igwn-py311-20260701
environment-variables={'HDF5_USE_FILE_LOCKING': False, 'OMP_NUM_THREADS'=1, 'OMP_PROC_BIND'=False}

################################################################################
## Prior arguments
################################################################################

default-prior = BBHPriorDict
deltaT=0.2

prior-dict = {
   chirp_mass = bilby.gw.prior.UniformInComponentsChirpMass(name='chirp_mass', minimum=8.351204187, maximum=8.729313755, unit='$M_\{\{\odot\}\}$'),
   mass_ratio = bilby.gw.prior.UniformInComponentsMassRatio(name='mass_ratio', minimum=0.05, maximum=1.0),
   mass_1 = Constraint(name='mass_1', minimum=1, maximum=1000),
   mass_2 = Constraint(name='mass_2', minimum=1, maximum=1000),
   a_1 = Uniform(name='a_1', minimum=0, maximum=0.99),
   a_2 = Uniform(name='a_2', minimum=0, maximum=0.99),
   tilt_1 = Sine(name='tilt_1'),
   tilt_2 = Sine(name='tilt_2'),
   phi_12 = Uniform(name='phi_12', minimum=0, maximum=2 * np.pi, boundary='periodic'),
   phi_jl = Uniform(name='phi_jl', minimum=0, maximum=2 * np.pi, boundary='periodic'),
   luminosity_distance =  bilby.gw.prior.UniformSourceFrame(name='luminosity_distance', maximum=4021.5, minimum=101.3,   unit='Mpc'),
   dec = Cosine(name='dec'),
   ra = Uniform(name='ra', minimum=0, maximum=2 * np.pi, boundary='periodic'),
   theta_jn = Sine(name='theta_jn'),
   psi = Uniform(name='psi', minimum=0, maximum=np.pi, boundary='periodic'),
   phase = Uniform(name='phase', minimum=0, maximum=2 * np.pi, boundary='periodic')}

enforce-signal-duration=False

################################################################################
## Post processing arguments
################################################################################

postprocessing-executable=None
postprocessing-arguments=None
single-postprocessing-executable=None
single-postprocessing-arguments=None

################################################################################
## Sampler arguments
################################################################################

sampler=dynesty
sampling-seed=1
n-parallel=3
sampler-kwargs={'nlive': 1000, 'naccept': 60, 'check_point_plot': True, 'check_point_delta_t': 1800, 'print_method': 'interval-60', 'sample': 'acceptance-walk'}

################################################################################
## Waveform arguments
################################################################################

waveform-generator=bilby.gw.waveform_generator.LALCBCWaveformGenerator
reference-frequency=20.0
waveform-approximant=IMRPhenomXPHM
catch-waveform-errors=True
pn-spin-order=-1
pn-tidal-order=-1
pn-phase-order=-1
pn-amplitude-order=0
numerical-relativity-file=None
waveform-arguments-dict={'PhenomXHMReleaseVersion': 122022, 'PhenomXPFinalSpinMod': 2, 'PhenomXPrecVersion': 320}
mode-array=None
frequency-domain-source-model=lal_binary_black_hole
conversion-function=None
generation-function=None
